# ==========================================
# SERVER
# ==========================================
server.port=${PORT:10000}

# ==========================================
# DATABASE (Supabase / PostgreSQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==========================================
# JPA / Hibernate
# ==========================================
# ✅ Supabase Transaction Pooler fix — ఇవి ADD చేయి
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0



spring.jpa.hibernate.ddl-auto=update
# JDBC URL already has user+password, so explicitly set cheyyi
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# RESEND EMAIL API (replaces Gmail SMTP)
# Render lo RESEND_API_KEY environment variable set cheyyi
# ==========================================
resend.api.key=${RESEND_API_KEY}

# ==========================================
# APPLICATION SETTINGS
# ==========================================
app.admin.email=hanumansangamu@gmail.com
app.mail.from=onboarding@resend.dev
app.mail.from-name=Hanuman Sangam
app.admin.phone=${ADMIN_PHONE}
app.admin.password=${ADMIN_PASSWORD}

# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.com.sangam=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
